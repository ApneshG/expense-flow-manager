services:
  - type: web
    name: expense-flow-manager
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install --include=dev && npm run build && npm run db:push
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        fromDatabase:
          name: expense-flow-db
          property: connectionString
      - key: SENDGRID_API_KEY
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: APP_URL
        sync: false

databases:
  - name: expense-flow-db
    plan: free
    region: singapore
    postgresMajorVersion: "16"
